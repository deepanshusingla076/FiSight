# Local infrastructure: ML API + Postgres + Redis
# Run: docker compose up -d ml
# Dev web: npm run dev (host)

services:
  ml:
    build:
      context: ./ml
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./ml/models:/app/models

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fisight
      POSTGRES_PASSWORD: fisight
      POSTGRES_DB: fisight
    ports:
      - "5432:5432"
    volumes:
      - fisight_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  fisight_pg:
